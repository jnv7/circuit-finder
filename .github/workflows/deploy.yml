name: CI + Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed site is the built app, not raw source
        run: |
          set -euo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}/"
          # Both entry points (the tool and, since Phase 23, the routes page):
          # a second entry is exactly the kind of change that can silently ship
          # raw source.
          for PAGE in "" "routes.html"; do
            URL="${BASE}${PAGE}"
            BODY="$(curl -sL "$URL")"
            if echo "$BODY" | grep -q '/src/'; then
              echo "::error::Deployed page $URL references /src/ — this is raw, unbuilt source, not the Vite build output. Check the repository's Settings > Pages > Source is set to 'GitHub Actions', not 'Deploy from a branch'."
              exit 1
            fi
            if ! echo "$BODY" | grep -qE '/circuit-finder/assets/[^"]+\.js'; then
              echo "::error::Deployed page $URL does not reference a built asset under /circuit-finder/assets/*.js — the live site may not be serving a real build."
              exit 1
            fi
            echo "Deployed page verified: $URL serves a real build, not raw source."
          done
